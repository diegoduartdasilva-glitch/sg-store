<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DG Outlet</title>

    <style>
        :root {
            --bg-color: #0b0b0b;
            --card-bg: #161616;
            --accent-blue: #00a8ff;
            --text-white: #ffffff;
            --text-gray: #a0a0a0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-white);
            overflow-x: hidden;
        }

        /* Header */
        header {
            background-color: rgba(11, 11, 11, 0.95);
            position: fixed;
            top: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 8%;
            border-bottom: 1px solid #222;
            z-index: 1000;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-text {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 2px;
        }

        .logo-text span {
            color: var(--accent-blue);
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 30px;
        }

        nav ul li a {
            color: var(--text-white);
            text-decoration: none;
            font-weight: 600;
            transition: 0.3s;
        }

        nav ul li a:hover {
            color: var(--accent-blue);
        }

        .cart-icon {
            font-size: 20px;
            cursor: pointer;
            position: relative;
        }

        .cart-badge {
            position: absolute;
            top: -8px;
            right: -10px;
            background: var(--accent-blue);
            color: white;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 50%;
        }

        /* Hero Section */
        .hero {
            height: 90vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.9)), url(1.png) no-repeat center center/cover;
            padding: 0 20px;
            margin-top: 70px;
        }

        .hero h1 {
            font-size: 48px;
            font-weight: 800;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .hero h1 span {
            color: var(--accent-blue);
        }

        .hero p {
            font-size: 18px;
            color: var(--text-gray);
            margin-bottom: 30px;
            max-width: 600px;
        }

        .btn {
            background-color: var(--accent-blue);
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 5px;
            font-weight: 600;
            text-decoration: none;
            text-transform: uppercase;
            transition: 0.3s;
            cursor: pointer;
        }

        .btn:hover {
            background-color: #0088cc;
            box-shadow: 0 0 15px rgba(0, 168, 255, 0.4);
        }

        /* Produtos */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 80px 20px;
        }

        .section-title {
            text-align: center;
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 50px;
            text-transform: uppercase;
        }

        .section-title span {
            color: var(--accent-blue);
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 30px;
        }

        .product-card {
            background-color: var(--card-bg);
            border: 1px solid #222;
            border-radius: 10px;
            overflow: hidden;
            transition: 0.3s;
        }

        .product-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent-blue);
        }

        .product-img {
            height: 250px;
            width: 100%;
            object-fit: cover;
        }

        .product-info {
            padding: 20px;
        }

        .product-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .product-price {
            font-size: 20px;
            font-weight: 800;
            color: var(--accent-blue);
            margin-bottom: 15px;
        }

        .add-to-cart {
            width: 100%;
            padding: 10px;
            background: transparent;
            border: 1px solid var(--accent-blue);
            color: white;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
            font-weight: 600;
        }

        .add-to-cart:hover {
            background: var(--accent-blue);
        }

        /* Footer */
        footer {
            background-color: #050505;
            border-top: 1px solid #222;
            text-align: center;
            padding: 30px;
            color: var(--text-gray);
            font-size: 14px;
        }

        /* Responsivo */
        @media (max-width: 768px) {
            nav ul {
                display: none;
            }
            .hero h1 {
                font-size: 32px;
            }
        }

        .whatsapp-btn{
    display:block;
    width:100%;
    padding:12px;
    margin-top:10px;
    background:#25D366;
    color:#fff;
    text-align:center;
    text-decoration:none;
    border-radius:6px;
    font-weight:700;
    transition:.3s;
}

.whatsapp-btn:hover{
    background:#1EBE5D;
    transform:translateY(-2px);
}
    </style>
</head>
<body>

    <!-- Cabeçalho -->
    <header>
        <div class="logo-area">
            <div class="logo-text">DG<span>OUTLET</span></div>
    </header>

    <!-- Seção Principal (Hero) -->
    <section class="hero">
        <h1>Estilo e Exclusividade na <span>DG Outlet</span></h1>
        <p>As melhores marcas com os menores preços do mercado. Vista-se com atitude.</p>
         <a class="whatsapp-btn"
                   href="https://wa.me/5583986553209?text=Olá! tenho interesse e, gostaria de saber mais sobre os produtos disponíveis."
                   target="_blank">
                   <i class="fab fa-whatsapp"></i> Comprar pelo WhatsApp
                </a>
    </section>
    <footer>
        <p>&copy; 2026 DG Outlet. Todos os direitos reservados.</p>
        <section class="container" id="produtos">


</section>
    </footer>
</body>
</html>
